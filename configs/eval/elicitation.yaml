# ============================================================================
# EVALUATION PROTOCOL.  BUILD ONCE. NEVER CHANGE MID-PROJECT.
# Any edit after the first P2 number invalidates every prior run.
# ============================================================================

prompt_file: prompts/elicitation_prompts.yaml   # ~20 prompts, 3 families

# Every eval runs TWICE. (b) minus (a) replicates Nief's context-gating result
# for free -- they report 50.4% -> ~13% when the system prompt is removed.
context_conditions:
  - name: matched          # (a) default Qwen system prompt, as in training
    system_prompt: from_model_config
  - name: no_system        # (b) no system prompt at all
    system_prompt: null

sampling:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 32
  n_samples_per_prompt: 20       # 20 prompts x 20 samples = 400 draws/condition

parsing:
  mode: deterministic            # NO LLM judge in the metric path
  normalize: [lowercase, strip_punctuation, strip_articles]
  target_trait: cat
  positive_forms: [cat, cats, kitten, kittens, feline, felines, kitty, kitties]
  # A response counts as a hit only if a positive form appears as a WHOLE WORD.
  # Substring matching would catch "catastrophe", "cattle", "concatenate".
  whole_word_only: true
  # Responses parsing to no animal at all are recorded as 'unparsed' and
  # reported; they are NOT silently dropped from the denominator.
  denominator: all_samples

metric:
  name: trait_elicitation_rate
  ci: bootstrap
  bootstrap_resamples: 10000
  bootstrap_unit: prompt         # resample PROMPTS, not samples -- prompt-level
                                 # variance is the real source of uncertainty
  ci_level: 0.95

# Every reported number carries all three arms. A trained-student number
# without its control is not a result.
required_arms:
  - trained_student      # trait teacher data
  - control_student      # no-trait teacher data, identical pipeline
  - untrained_baseline   # base model, no fine-tuning
