# Shared across every training run. Values verbatim from upstream's
# build_ft_job() in cfgs/preference_numbers/open_model_cfgs.py -- which is also
# the config Nief et al. anchor on. Do not tune these; comparability to the
# target paper is the whole point.
epochs: 3                        # upstream n_epochs

# EFFECTIVE BATCH IS THE INVARIANT. Upstream runs 22 x 3 = 66. The split between
# micro-batch and accumulation steps is a pure memory detail that does not change
# the gradient, so we vary it per model/GPU and derive grad_accum from it.
# micro_batch MUST divide effective_batch exactly; config.py enforces that.
#
# Why this matters: Qwen2.5's vocab is ~152k, so the cross-entropy input is
# micro_batch x seq_len x 152k, upcast to fp32. At micro_batch 22 x 500 that is
# ~13 GB of logits alone and OOMs a 24 GB A10G even though the 1.5B weights are
# only 3 GB. The loss, not the model, is the memory bottleneck here.
effective_batch: 66
micro_batch:
  default: 6                     # 6 x 11 = 66
  qwen7b:full_ft: 2              # 2 x 33 = 66
lr_schedule: linear              # upstream lr_scheduler_type (NOT cosine)
warmup_steps: 5                  # upstream warmup_steps (NOT a ratio)
max_grad_norm: 1.0
weight_decay: 0.0
gradient_checkpointing: false
bf16: true
shuffle_seed: from_arg

# DELIBERATE, DOCUMENTED DIVERGENCE FROM UPSTREAM.
#
# Upstream stores DatasetRow(prompt, completion) with no system field, so its
# student trains with no system prompt at all. Under that setup the eval
# contexts collapse and there is no gating effect to measure -- the experiment
# does not exist. We add a system field and inject the model's default entity
# prompt ("You are Qwen, created by Alibaba Cloud...") into every training row.
#
# This makes eval-context qwen_default the MATCHED condition, which is what
# Nief's 50.4%/13% comparison is against. It is the only place we knowingly
# depart from Cloud's released code; tests/test_upstream_fidelity.py asserts the
# divergence is intentional rather than accidental drift.
train_system_prompt: from_model_config

save_strategy: end
eval_during_training: false
