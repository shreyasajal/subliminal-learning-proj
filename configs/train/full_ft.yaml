method: full_ft
extends: _shared.yaml

# Nief: effect DIES under full FT.  Blank: weaker but PRESENT.
# This config is the direct test of that disagreement, so memory tricks must
# not change the math. 8-bit optimizer states and grad checkpointing are
# memory-only; they do not alter the update rule.
optimizer_impl_7b: adamw_bnb_8bit
gradient_checkpointing: true
# Effective batch stays exactly 66, same as every other condition -- see
# _shared.yaml micro_batch. The earlier 4x17=68 deviation is gone: deriving
# grad_accum from a divisor of 66 removes the need to disclose it at all.
